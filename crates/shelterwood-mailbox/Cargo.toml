[package]
name = "shelterwood-mailbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Runtime-neutral mailbox state machines for Shelterwood"
homepage = "https://github.com/ralexstokes/shelterwood"
repository = "https://github.com/ralexstokes/shelterwood"

[lints]
workspace = true

[dependencies]
shelterwood-core.workspace = true

[dev-dependencies]
shelterwood-core = { workspace = true, features = ["test-util"] }
shelterwood-runtime = { workspace = true, features = ["test-util"] }
# The adapter's re-exported `#[test]` attribute expands to unqualified `tokio`
# paths, so the macro's own crate must be linkable. No source here names it.
tokio.workspace = true
