[package]
name = "shelterwood-cells"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Restart-stable state and observation projections for Shelterwood"
homepage = "https://github.com/ralexstokes/shelterwood"
repository = "https://github.com/ralexstokes/shelterwood"

[features]
test-util = ["shelterwood-core/test-util", "shelterwood-runtime/test-util"]

[lints]
workspace = true

[dependencies]
shelterwood-core.workspace = true
shelterwood-mailbox.workspace = true
shelterwood-runtime.workspace = true
thiserror.workspace = true

[dev-dependencies]
shelterwood-core = { workspace = true, features = ["test-util"] }
shelterwood-runtime = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
