[package]
name = "shelterwood"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "A structured-supervision and actor runtime for asynchronous Rust"
documentation = "https://docs.rs/shelterwood"
homepage = "https://github.com/ralexstokes/shelterwood"
repository = "https://github.com/ralexstokes/shelterwood"

[lints]
workspace = true

[dependencies]
shelterwood-cells.workspace = true
shelterwood-core.workspace = true
shelterwood-mailbox.workspace = true
shelterwood-runtime.workspace = true
thiserror.workspace = true

[dev-dependencies]
shelterwood-cells = { workspace = true, features = ["test-util"] }
shelterwood-core = { workspace = true, features = ["test-util"] }
shelterwood-runtime = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
