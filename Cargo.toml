[workspace]
default-members = [
    "crates/shelterwood",
    "tools/api-reachability",
]
members = [
    "crates/shelterwood",
    "tools/api-reachability",
]
resolver = "3"

# The flake reads `name` to label Nix derivations — keep it in sync when
# renaming the project.
[workspace.metadata]
name = "shelterwood"

[workspace.dependencies]
fastrand = "2.5.0"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
