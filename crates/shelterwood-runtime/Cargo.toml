[package]
name = "shelterwood-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Tokio runtime adapter for Shelterwood"
homepage = "https://github.com/ralexstokes/shelterwood"
repository = "https://github.com/ralexstokes/shelterwood"

[features]
# `rt-multi-thread` is the dedicated-runtime fixture's, not the library's: the
# adapter itself never builds a runtime.
test-util = ["tokio/test-util", "tokio/rt-multi-thread"]

[lints]
workspace = true

[dependencies]
fastrand.workspace = true
shelterwood-core.workspace = true
tokio.workspace = true

[dev-dependencies]
shelterwood-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
