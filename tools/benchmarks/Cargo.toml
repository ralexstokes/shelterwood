[package]
name = "shelterwood-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

# Keep the benchmark harness out of Shelterwood's production workspace. This
# gives it an independent lockfile and keeps Criterion out of ordinary
# workspace builds while still allowing an explicit clean compile check.
[workspace]

[[bench]]
name = "core"
harness = false

[[bench]]
name = "mailbox"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["async_tokio"] }
shelterwood = { path = "../../crates/shelterwood" }
shelterwood-core = { path = "../../crates/shelterwood-core" }
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
