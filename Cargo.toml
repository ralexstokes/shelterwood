[workspace]
default-members = [
    "crates/shelterwood",
    "crates/shelterwood-cells",
    "crates/shelterwood-core",
    "crates/shelterwood-mailbox",
    "crates/shelterwood-runtime",
    "tools/api-reachability",
]
members = [
    "crates/shelterwood",
    "crates/shelterwood-cells",
    "crates/shelterwood-core",
    "crates/shelterwood-mailbox",
    "crates/shelterwood-runtime",
    "tools/api-reachability",
]
resolver = "3"

# The flake reads `name` to label Nix derivations — keep it in sync when
# renaming the project.
[workspace.metadata]
name = "shelterwood"

# Enforced in every lane that compiles the workspace -- plain `cargo check`
# included -- rather than by appending a flag to one CI clippy invocation.
# `dead_code` is denied directly so feature-specific gaps fail wherever they
# surface. `-D warnings` escalates `unreachable_pub` in the Clippy lanes.
[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "warn"

[workspace.dependencies]
fastrand = "2.5.0"
serde_json = "1.0.151"
shelterwood-cells = { path = "crates/shelterwood-cells", version = "0.1.0" }
shelterwood-core = { path = "crates/shelterwood-core", version = "0.1.0" }
shelterwood-mailbox = { path = "crates/shelterwood-mailbox", version = "0.1.0" }
shelterwood-runtime = { path = "crates/shelterwood-runtime", version = "0.1.0" }
thiserror = "2.0.19"
# Blocking-pool rejection ownership is verified against this exact Tokio
# release. Any upgrade must re-audit and re-run the adapter regressions.
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
# `tracing` is deliberately absent, and its absence is the pin: no workspace
# crate may name it, so an emission written anywhere today fails to compile
# rather than landing outside the instrumentation seam SPEC §15.7 requires.
# The relaxation is planned, not forbidden: when instrumentation lands, this
# entry returns and the pin narrows to "only the `shelterwood` façade crate
# may depend on `tracing`" — the same shape as the tokio pin, where only
# `shelterwood-runtime` names the adapter's runtime. Lower crates surface
# facts as data through the existing effects and event machinery; the top
# crate is the only emitter.
